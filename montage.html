<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===========================================================================
       BALISES DE PARTAGE — même remarque que sur index.html : les robots des
       réseaux ne lancent pas le JavaScript, ces balises doivent donc rester
       écrites en dur. C'est cette page-là que tu enverras à un client, donc
       c'est son aperçu qu'il faut soigner en premier.
       ======================================================================== -->
  <title>Montage vidéo & clipping — Forrest The Dump</title>
  <meta name="description" content="Montage de clips, formats courts verticaux et longs formats. Réalisations, offre et contact.">

  <link rel="canonical" href="https://4restdump.vercel.app/montage.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Forrest The Dump">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://4restdump.vercel.app/montage.html">
  <meta property="og:title" content="Montage vidéo & clipping — Forrest The Dump">
  <meta property="og:description" content="Montage de clips, formats courts verticaux et longs formats. Réalisations, offre et contact.">
  <!-- Idéalement une image différente de celle du hub : une frame de tes montages. -->
  <meta property="og:image" content="https://4restdump.vercel.app/assets/og-montage.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Montage vidéo et clipping par Forrest The Dump">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Montage vidéo & clipping — Forrest The Dump">
  <meta name="twitter:description" content="Montage de clips, formats courts verticaux et longs formats. Réalisations, offre et contact.">
  <meta name="twitter:image" content="https://4restdump.vercel.app/assets/og-montage.png">

  <meta name="theme-color" content="#070907">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>

<!-- data-page indique à links.js quelle page rendre. Ne pas modifier. -->
<body data-page="montage">

  <noscript>
    <p class="noscript">Ce site a besoin de JavaScript pour afficher son contenu.</p>
  </noscript>

  <!-- Emplacements vides : tout le contenu vient de SITE.montage dans links.js. -->
  <main class="wrap wrap--wide">
    <header class="montage-header" id="montage-header"></header>

    <section class="section" id="services"></section>
    <section class="section" id="works"></section>
    <section class="section" id="contact"></section>

    <nav class="back" id="back" aria-label="Navigation secondaire"></nav>
  </main>

  <script src="links.js" defer></script>
</body>
</html>
