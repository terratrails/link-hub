<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===========================================================================
       BALISES DE PARTAGE — la seule zone de contenu qui reste dans le HTML.
       Pourquoi : les robots de Facebook, X, iMessage, WhatsApp et Discord ne
       lancent pas le JavaScript. Une balise injectée depuis links.js serait
       invisible pour eux et l'aperçu du lien partagé sortirait vide.
       À éditer ici, donc, et à garder cohérent avec links.js.
       ======================================================================== -->
  <title>throughmorpheus — développeur & monteur vidéo</title>
  <meta name="description" content="Mes projets de développement et mon activité de montage vidéo / clipping, au même endroit.">

  <!-- TODO : remplace https://exemple.com par ton domaine final, ici et dans montage.html. -->
  <link rel="canonical" href="https://exemple.com/">

  <!-- Open Graph (Facebook, Instagram, WhatsApp, Discord, LinkedIn…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="throughmorpheus">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://exemple.com/">
  <meta property="og:title" content="throughmorpheus — développeur & monteur vidéo">
  <meta property="og:description" content="Mes projets de développement et mon activité de montage vidéo / clipping, au même endroit.">
  <!-- L'image de partage doit être en URL absolue : les robots ne résolvent pas
       les chemins relatifs. 1200x630 px recommandé. -->
  <meta property="og:image" content="https://exemple.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="throughmorpheus — développeur et monteur vidéo">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="throughmorpheus — développeur & monteur vidéo">
  <meta name="twitter:description" content="Mes projets de développement et mon activité de montage vidéo / clipping, au même endroit.">
  <meta name="twitter:image" content="https://exemple.com/assets/og-image.png">

  <meta name="theme-color" content="#08080a">

  <!-- Favicon (placeholder : remplace les fichiers dans assets/). -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>

<!-- data-page indique à links.js quelle page rendre. Ne pas modifier. -->
<body data-page="hub">

  <noscript>
    <p class="noscript">Ce site a besoin de JavaScript pour afficher ses liens.</p>
  </noscript>

  <!-- Emplacements vides : tout le contenu est injecté par links.js.
       Aucun texte ni lien à écrire ici. -->
  <main class="wrap">
    <header class="profile" id="profile"></header>

    <div id="featured"></div>

    <section class="group" id="socials"></section>
    <section class="group" id="projects"></section>

    <footer id="footer"></footer>
  </main>

  <script src="links.js" defer></script>
</body>
</html>
